name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go/go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  swift-interop-verifier:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile TesseraCore + verifier (no SPM)
        run: swiftc -O swift/Sources/TesseraCore/*.swift swift/Tools/verify/main.swift -o tessera_verify
      - name: Run shared interop vectors
        run: ./tessera_verify "${GITHUB_WORKSPACE}/spec"

  swift-spm-tests:
    runs-on: macos-26
    defaults:
      run:
        working-directory: swift
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run XCTest (argon2id + full vault cross-decrypt)
        run: swift test

  installer:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Shellcheck
        run: shellcheck install.sh test/install_test.sh
      - name: Install from a local tarball
        run: ./test/install_test.sh
